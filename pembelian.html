<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pembelian Kopi</title>
  <link rel="stylesheet" href="pembelian.css">
</head>
<body>

  <header>
    <h1>🛒 Halaman Pembelian</h1>
    <p>Lengkapi data pembelian kopi Anda</p>
  </header>

  <section class="checkout">
    <form onsubmit="pesan(event)">
      <label>Nama Pembeli</label>
      <input type="text" id="nama" required>

      <label>Pilih Kopi</label>
      <select id="kopi">
        <option>Kopi Arabika</option>
        <option>Kopi Robusta</option>
        <option>Kopi Latte</option>
      </select>

      <label>Jumlah</label>
      <input type="number" id="jumlah" min="1" value="1" required>

      <label>Alamat</label>
      <textarea id="alamat" required></textarea>

      <button type="submit">Pesan Sekarang</button>
    </form>
  </section>

  <footer>
    <button class="kembali" onclick="index.html">⬅ Kembali</button>
  </footer>

  <script src="kopi.js"></script>
</body>
</html>
